name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Reproduce candidate
        run: python3 scripts/check_candidate.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

